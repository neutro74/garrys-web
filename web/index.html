<style>
  html, body { margin: 0; height: 100%; background: #0b5fae; overflow: hidden; }
  canvas#screen { display: block; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  /* The splash: shown from the first byte (everything it needs is in this file) until the launcher or the game takes over.
     Garry's Web blue with the logo and a Derma-style bar; #status is the line the launcher and the game write to. */
  #splash { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: hidden; color: #fff;
    font: bold 13px Tahoma, Verdana, Helvetica, Arial, sans-serif; transition: opacity .4s ease, visibility .4s;
    background: url("brand/background.jpg") center / cover no-repeat, radial-gradient(ellipse 90% 70% at 50% 42%, #2aa6ff 0%, #1194f0 30%, #0b6fd0 62%, #08509c 100%); }
  /* The banner's light running up the beam (tools/brand/render.mjs --background draws the beam; the light is animated here). */
  .gw-light { position: absolute; left: 50%; top: 50%; width: 260vmax; height: 34vmax; margin: -17vmax 0 0 -130vmax; pointer-events: none; transform: rotate(-33deg);
    background: linear-gradient(90deg, transparent 0 30%, rgba(225, 250, 255, .38) 45%, rgba(255, 255, 255, .55) 50%, rgba(225, 250, 255, .38) 55%, transparent 70% 100%) no-repeat;
    background-size: 30% 100%; mix-blend-mode: soft-light; filter: blur(18px); animation: gw-run 3.2s cubic-bezier(.45, 0, .55, 1) infinite; }
  @keyframes gw-run { 0% { background-position: -40% 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { background-position: 140% 0; opacity: 0; } }
  body.launcher-ready #splash, #splash:has(#status:empty) { opacity: 0; visibility: hidden; pointer-events: none; }
  /* Everything on one dark glass panel (the beam's white core runs behind it), with fixed-height lines so a longer tip or
     status never moves the bar. */
  .gw-splash { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(420px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 18px 24px 16px; border-radius: 8px; background: rgba(6, 28, 62, .58); box-shadow: 0 10px 40px rgba(0, 20, 60, .45), inset 0 1px 0 rgba(255, 255, 255, .12);
    backdrop-filter: blur(8px) saturate(1.2); -webkit-backdrop-filter: blur(8px) saturate(1.2); }
  .gw-splash img { width: min(288px, 72vw); height: auto; filter: drop-shadow(0 6px 14px rgba(0, 20, 60, .45)); }
  /* GMod's DProgress: a dark inset track with a lit blue fill; here moving back and forth until there is a real number. */
  .gw-bar { position: relative; flex: none; width: 100%; height: 14px; overflow: hidden; border-radius: 3px; background: linear-gradient(#1a2c44, #25405f);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .25); }
  .gw-bar::after { content: ""; position: absolute; top: 1px; bottom: 1px; left: 0; width: 34%; border-radius: 2px;
    background: linear-gradient(#9fd8ff, #3aa9f5 45%, #1a86e0 55%, #2b9bf0); box-shadow: 0 0 8px rgba(120, 200, 255, .8); animation: gw-slide 1.6s ease-in-out infinite alternate; }
  @keyframes gw-slide { from { left: 1px; } to { left: calc(66% - 1px); } }
  #status { flex: none; height: 48px; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; text-align: center; line-height: 16px; text-shadow: 0 1px 2px rgba(0, 20, 60, .8); overflow-wrap: anywhere; }
  .gw-tip { flex: none; height: 30px; width: 100%; overflow: hidden; text-align: center; color: rgba(255, 255, 255, .8); font-weight: normal; font-size: 12px; line-height: 15px; text-shadow: 0 1px 1px rgba(0, 20, 60, .6); transition: opacity .4s; }
  .gw-tip b { color: #fff; }
  @media (prefers-reduced-motion: reduce) { .gw-light { animation: none; opacity: 0; } .gw-bar::after { animation-duration: 4s; } }
</style>

<script>
  // Tips under the bar while it loads.
  (() => {
    const tips = ['Press <b>Shift+Tab</b> in game to open chat without leaving it.', 'Signed in, your saves, dupes and settings follow you to any browser.',
      'Share a save as a link from <b>Saves</b>; anyone can play it straight away.', 'The first start downloads the game; later starts are much faster.',

      'Friends hosting a game have a <b>Join game</b> button on their profile.'];
    const el = document.querySelector('[data-tip]');
    let i = Math.floor(Math.random() * tips.length);
    const next = () => { el.style.opacity = 0; setTimeout(() => { el.innerHTML = tips[i++ % tips.length]; el.style.opacity = 1; }, 400); };

    const t = setInterval(() => { if (document.body.classList.contains('launcher-ready')) clearInterval(t); else next(); }, 5000);
  })();
